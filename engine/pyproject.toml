[project]
name = "ojarvis-engine"
version = "0.1.0"
description = "Moteur d'O-jarvis : API locale, mémoire, voix et actions."
authors = [{ name = "Octave BAHOUN-HOUTOUKPE", email = "octavebahoun@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.14.0",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "openai>=3.31.0",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.4",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ojarvis-engine = "ojarvis.__main__:main"

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ojarvis"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "PT", "N", "C4", "PL", "TID", "T20"]
ignore = ["PLR0913", "PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["ojarvis"]

[[tool.mypy.overrides]]
module = ["keyring.*", "secretstorage.*", "jeepney.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
  "real: appelle un vrai service ou le vrai trousseau (lancé à la main)",
]
filterwarnings = [
  "error::DeprecationWarning:ojarvis.*",
  # Le client de test de Starlette annonce un futur client HTTP ; on garde httpx, établi.
  "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.coverage.run]
source = ["ojarvis"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
